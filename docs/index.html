<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Compare Lighter's semantic highlighting with syntax-only highlighters."
    />
    <title>Lighter — highlighter comparison</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles/arborium-base.css" />
    <link rel="stylesheet" href="styles/catppuccin-mocha.css" />
    <link rel="stylesheet" href="styles/highlightjs.css" />
    <link rel="stylesheet" href="styles/site.css" />
    <script src="vendor/highlight.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <header class="site-header">
        <div class="title-block">
          <p class="product-name">Lighter</p>
          <h1>Highlighter comparison</h1>
          <p class="summary">
            Compare semantic highlighting with syntax-only output.
          </p>
        </div>
        <div class="language-picker" aria-label="Choose a language">
          <span class="picker-label">Language</span>
          <div
            class="language-tabs"
            role="tablist"
            aria-label="Example language"
          ></div>
        </div>
      </header>

      <div class="demo-info">
        <p>Drag the divider to reveal the comparison.</p>
        <span id="status" role="status" aria-live="polite">Loading Rust…</span>
      </div>

      <section class="comparison" aria-label="Highlighter comparison">
        <header class="comparison-heading">
          <div>
            <h2>
              <a href="https://github.com/AlecGhost/lighter#readme">Lighter</a>
            </h2>
            <span class="column-kind">Tree-sitter + LSP</span>
          </div>
          <label class="comparison-picker">
            <span>Compare with</span>
            <select id="comparison-source" disabled>
              <option value="arborium">Arborium · Tree-sitter</option>
              <option value="highlightjs">
                Highlight.js · Regex-based modes
              </option>
            </select>
          </label>
        </header>

        <div id="code-viewport" class="code-viewport" style="--split: 65%">
          <pre
            id="comparison-pane"
            aria-hidden="true"
          ><code id="comparison-output"></code></pre>
          <div class="lighter-layer">
            <pre id="lighter-pane"><code id="lighter-output"></code></pre>
          </div>
          <div
            class="scrubber-line"
            role="slider"
            tabindex="0"
            aria-label="Comparison split"
            aria-orientation="vertical"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="35"
            aria-valuetext="65% Lighter, 35% Arborium"
          ></div>
        </div>
      </section>

      <footer>
        <p>
          Above: Lighter. Below:
          <span id="footer-comparison-label">Arborium</span>.
        </p>
        <p id="source-path" class="source-path"></p>
      </footer>
    </main>
  </body>
</html>
