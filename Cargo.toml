[package]
name = "alecghost-lighter"
description = "IDE-grade code highlighting"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/AlecGhost/lighter"
license = "Apache-2.0"

[lib]
name = "lighter"
path = "src/lib.rs"

[[bin]]
name = "lighter"
path = "src/main.rs"

[dependencies]
arborium = { version = "2.18", features = ["all-languages"] }
clap = { version = "4", features = ["derive", "string"] }
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
shlex = "1"
tempfile = "3.27.0"
arborium-highlight = "2.18.1"
arborium-theme = { version = "2.18.1", features = ["toml"] }
libc = "0.2.189"

[dev-dependencies]
insta = "1.43.1"
quickcheck = { version = "1.1.0", default-features = false }
